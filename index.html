<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Creative AI — صمم أفكارك بالذكاء الاصطناعي</title>

<!-- مكتبات التصدير وتأثيرات الاحتفال -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@500;600;700;800;900&family=Tajawal:wght@500;700;800&family=Readex+Pro:wght@500;600;700&display=swap');

:root {
  --bg-dark: #07090e;
  --bg-card: rgba(17, 21, 32, 0.85);
  --bg-card-hover: rgba(24, 31, 46, 0.95);
  --border: rgba(255, 255, 255, 0.08);
  --accent: #c2f83b;
  --accent-glow: rgba(194, 248, 59, 0.22);
  --text-main: #f3f4f6;
  --text-muted: #9ca3af;
  --white: #ffffff;
  --input-bg: #090d14;
  --canvas-bg: #030508;
}

body.light-mode {
  --bg-dark: #f8fafc;
  --bg-card: rgba(255, 255, 255, 0.92);
  --bg-card-hover: #f1f5f9;
  --border: rgba(0, 0, 0, 0.08);
  --accent: #65a30d;
  --accent-glow: rgba(101, 163, 13, 0.2);
  --text-main: #0f172a;
  --text-muted: #64748b;
  --white: #0f172a;
  --input-bg: #f1f5f9;
  --canvas-bg: #cbd5e1;
}

html, body {
  margin: 0; padding: 0; width: 100%; max-width: 100%;
  overflow-x: hidden; background: var(--bg-dark); color: var(--text-main);
  font-family: 'Cairo', 'IBM Plex Sans Arabic', sans-serif;
  -webkit-font-smoothing: antialiased; transition: background 0.3s ease, color 0.3s ease;
}

*{box-sizing:border-box}
button,input,textarea,select{font:inherit;outline:none}button{cursor:pointer}

.screen{min-height:100vh;display:none;position:relative;animation:fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)}
.screen.active{display:block}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.ambient-glow{position:fixed;top:-100px;left:50%;transform:translateX(-50%);width:750px;height:450px;background:radial-gradient(circle, rgba(194,248,59,0.08) 0%, rgba(0,0,0,0) 70%);pointer-events:none;z-index:0}

/* الشريط العلوي */
.nav{height:65px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(7, 9, 14, 0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:0;z-index:100}
body.light-mode .nav{background:rgba(255,255,255,0.85)}

.logo{font-size:16px;font-weight:900;color:var(--white);display:flex;align-items:center;gap:10px;cursor:pointer;letter-spacing:0.5px}
.logo-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:rgba(194, 248, 59, 0.12);border-radius:10px;border:1px solid rgba(194, 248, 59, 0.3);box-shadow:0 0 15px var(--accent-glow)}
.logo-icon svg{width:16px;height:16px}

.navlinks{display:flex;gap:28px;font-size:13px;font-weight:700;color:var(--text-muted)}
.navlinks span{cursor:pointer;transition:color 0.2s}.navlinks span:hover{color:var(--white)}

.nav-actions{display:flex;gap:10px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text-main);display:inline-flex;align-items:center;justify-content:center;transition:all 0.2s ease}
.icon-btn:hover{background:rgba(255,255,255,0.1);color:var(--white);transform:translateY(-1px)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.btn{border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text-main);border-radius:99px;padding:8px 18px;font-size:12px;font-weight:700;transition:all 0.2s ease;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.2);transform:translateY(-1px)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#000;box-shadow:0 0 20px var(--accent-glow);font-weight:800}.btn.accent:hover{background:#b1e62a}

/* الواجهة الرئيسية */
.dashboard-container { max-width: 900px; margin: 0 auto; padding: 30px 20px 80px; }
.hero-prompt-card { background: linear-gradient(135deg, rgba(17, 21, 32, 0.9), rgba(24, 31, 46, 0.9)); border: 1px solid var(--border); border-radius: 24px; padding: 36px 28px; text-align: center; margin-bottom: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); backdrop-filter: blur(20px); position: relative; overflow: hidden; }
.hero-prompt-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.hero-prompt-card h1 { font-size: 28px; font-weight: 900; margin: 0 0 8px; color: var(--white); }
.hero-prompt-card p { font-size: 14px; color: var(--text-muted); margin: 0 0 24px; }
.hero-action-btn { background: var(--accent); color: #000; border: none; font-weight: 900; font-size: 15px; padding: 14px 36px; border-radius: 99px; box-shadow: 0 0 25px var(--accent-glow); cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; }
.hero-action-btn:hover { transform: translateY(-2px) scale(1.02); background: #b1e62a; }

.dash-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 22px; margin-bottom: 20px; backdrop-filter: blur(20px); }
.dash-section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.dash-section-title { font-size: 15px; font-weight: 800; color: var(--white); display: flex; align-items: center; gap: 8px; }
.link-btn { background: none; border: none; color: var(--accent); font-size: 12px; font-weight: 700; cursor: pointer; }

.recent-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.recent-card { background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; transition: all 0.2s ease; }
.recent-card:hover { border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
.recent-thumb { height: 120px; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 10px; position: relative; }
.recent-thumb::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,0.8), transparent); }
.recent-info { position: relative; z-index: 2; font-size: 11px; font-weight: 800; color: #fff; }

.brand-strip { display: flex; align-items: center; justify-content: space-between; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; }
.brand-details b { font-size: 14px; color: var(--white); display: block; }
.brand-tags { display: flex; gap: 12px; margin-top: 6px; font-size: 11px; color: var(--text-muted); }
.brand-tags span { display: flex; align-items: center; gap: 4px; }
.brand-tags .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.ideas-chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.idea-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 12px; padding: 14px 10px; text-align: center; font-size: 12px; font-weight: 800; color: var(--text-main); cursor: pointer; transition: all 0.2s ease; }
.idea-btn:hover { background: rgba(194, 248, 59, 0.1); border-color: var(--accent); color: var(--white); transform: translateY(-2px); }

/* محرر الاستديو */
.app { min-height: 100vh; display: flex; }
.sidebar { width: 230px; background: rgba(17, 21, 32, 0.6); backdrop-filter: blur(20px); border-left: 1px solid var(--border); padding: 24px 16px; flex-shrink: 0; display: flex; flex-direction: column; }
body[dir="ltr"] .sidebar { border-left: none; border-right: 1px solid var(--border); }
.side-logo { padding: 0 8px 24px; }
.side-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; margin: 3px 0; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; transition: all 0.15s ease; }
.side-item:hover { background: rgba(255,255,255,0.05); color: var(--white); }
.side-item.active { background: rgba(194, 248, 59, 0.1); color: var(--accent); border: 1px solid rgba(194, 248, 59, 0.25); }
.side-item svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }

.main { flex: 1; padding: 30px 40px; max-width: 1200px; }
.toprow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.toprow h2 { margin: 0; font-size: 22px; font-weight: 800; color: var(--white); }

.editor { display: grid; grid-template-columns: 150px 1fr 350px; gap: 18px; align-items: start; }
.tools { background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; position: sticky; top: 84px; }
.controls { background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 18px; }
.tool { padding: 10px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; color: var(--text-muted); cursor: pointer; margin-bottom: 6px; transition: all 0.15s; display: flex; align-items: center; gap: 8px; }
.tool.active,.tool:hover { background: rgba(255,255,255,0.06); color: var(--white); }

.canvas { background: var(--canvas-bg); border: 1px solid var(--border); border-radius: 18px; display: flex; align-items: center; justify-content: center; min-height: 520px; padding: 24px; position: sticky; top: 84px; z-index: 10; }
.poster { width: min(330px,90%); aspect-ratio: 1/1.25; background: #111622; border-radius: 14px; color: white; padding: 24px; display: flex; flex-direction: column; justify-content: flex-end; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1); overflow: hidden; background-size: cover; background-position: center; transition: all 0.3s ease; }
.poster-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.45); pointer-events: none; z-index: 1; transition: background 0.2s ease; }

.draggable-item { cursor: grab; user-select: none; touch-action: none; display: inline-block; position: relative; z-index: 2; transition: transform 0.05s ease-out; }
.draggable-item:hover { outline: 1px dashed rgba(194, 248, 59, 0.8); border-radius: 4px; }
